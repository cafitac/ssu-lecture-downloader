name: Release

# Publishes a signed macOS build to GitHub Releases, where the in-app updater reads latest.json.
# Only the owner starts it: push a `v<x.y.z>` tag, or run it by hand (workflow_dispatch).
# Never add a pull_request trigger: this workflow can read the signing key and write releases.
#
# Flow: verify-version -> build-macos (uploads a DRAFT release, invisible to clients)
#       -> finalize (checks the draft's latest.json, then publishes it).
# Manual runs publish nothing unless `publish` is ticked, so `publish: false` is a dry run that
# leaves a checked draft behind. Steps are in docs/development.md ("Releasing").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z (must equal tauri.conf.json, Cargo.toml, package.json, pyproject.toml)"
        required: true
        type: string
      publish:
        description: "Publish the draft after the checks. Leave off for a dry run."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run per release tag at a time, whether it came from a tag push (v0.2.0) or a dispatch
  # (0.2.0 or v0.2.0); a second run waits instead of racing on the same draft.
  group: release-${{ github.event_name == 'push' && github.ref_name || (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag (or the dispatch input) must equal the version in every manifest and lockfile.
      # Nothing is built or uploaded if it does not.
      - name: Tag equals the manifest versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then RAW="$REF_NAME"; else RAW="$INPUT_VERSION"; fi
          VERSION="${RAW#v}"
          python3 scripts/bump_version.py --check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: verify-version
    # Intel runner: matches the installed app (x86_64), same as ci.yml.
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Fail instead of silently re-resolving when uv.lock is stale.
      UV_LOCKED: "1"
    outputs:
      release-id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail in seconds, not after a 30-minute build, when a signing secret is missing.
      # The values are never printed.
      - name: Signing secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Actions secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"; exit 1; }

      # Every action below is pinned to a commit at least two weeks old. This job holds the
      # signing key, so no cache is restored or saved (a poisoned cache could alter the build).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Same interpreter family as the local sidecar build (3.12.11), not the runner default.
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Commit of the `stable` branch from 2026-10-09; the toolchain is named because a commit pin
      # carries no channel.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # tauri-build requires resources/backend-sidecar to exist, so the sidecar comes first
      # (same step as ci.yml).
      - name: Build backend sidecar
        working-directory: frontend
        run: npm run build:backend-sidecar

      # The BUILT sidecar must import rusaint and load its native library (same check as ci.yml).
      - name: Smoke-test the built sidecar (grades available)
        run: python3 scripts/smoke_backend_sidecar.py

      # Signed build with the committed tauri.conf.json (createUpdaterArtifacts: true, public key).
      # No config override: the app bundle, .dmg, .app.tar.gz and .sig are all signed/produced here.
      # Same repository, so no owner/repo; the draft stays invisible to latest/download until finalize.
      # Pinned to the commit of release action-v1.0.0 (2026-06-29).
      - name: Build, sign and upload to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ needs.verify-version.outputs.tag }}
          releaseName: SSU Lecture Downloader ${{ needs.verify-version.outputs.tag }}
          releaseBody: Installer for macOS (Intel). Installed apps update themselves from this release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      - name: Check the sidecar is inside the app bundle
        run: |
          APP=$(find frontend/src-tauri/target -type d -name "SSU Lecture Downloader.app" -path "*/bundle/macos/*" | head -n 1)
          test -n "$APP" || { echo "app bundle not found"; exit 1; }
          echo "bundle: $APP"
          SIDECAR="$APP/Contents/Resources/resources/backend-sidecar/ssu-api"
          test -x "$SIDECAR/ssu-api" || { echo "missing executable $SIDECAR/ssu-api"; exit 1; }
          test -d "$SIDECAR/_internal" || { echo "missing $SIDECAR/_internal"; exit 1; }
          test -f "$SIDECAR/_internal/rusaint/librusaint_ffi.dylib" || { echo "missing rusaint native library in $SIDECAR"; exit 1; }

  finalize:
    needs: [verify-version, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.build-macos.outputs.release-id }}
      VERSION: ${{ needs.verify-version.outputs.version }}
      TAG: ${{ needs.verify-version.outputs.tag }}
    steps:
      # tauri.conf.json carries the public key the signatures are compared with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # latest.json is the one file every installed app trusts: a missing platform or an empty
      # signature in it breaks the update check for everyone. So the draft is read back and checked
      # before it becomes visible.
      - name: Check the draft release and its latest.json
        run: |
          test -n "$RELEASE_ID" || { echo "::error::build-macos did not report a release id"; exit 1; }
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' release.json > /dev/null \
            || { echo "::error::release $RELEASE_ID is not the draft for $TAG"; exit 1; }
          echo "Draft assets:"
          jq -r '.assets[] | "  \(.name)  \(.size) bytes"' release.json
          ASSET_ID=$(jq -r '[.assets[] | select(.name == "latest.json")][0].id // empty' release.json)
          test -n "$ASSET_ID" || { echo "::error::the draft has no latest.json asset"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$ASSET_ID" > latest.json
          jq -e 'type == "object"' latest.json > /dev/null || { echo "::error::latest.json is not a JSON object"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' latest.json > /dev/null \
            || { echo "::error::latest.json version is not $VERSION"; exit 1; }
          # darwin-x86_64 is the key the updater reads; darwin-x86_64-app is the per-bundle entry.
          for PLATFORM in darwin-x86_64 darwin-x86_64-app; do
            jq -e --arg p "$PLATFORM" '(.platforms[$p].signature // "") | type == "string" and length > 0' latest.json > /dev/null \
              || { echo "::error::latest.json platforms.$PLATFORM has no signature"; exit 1; }
            jq -e --arg p "$PLATFORM" --arg repo "$GH_REPO" '(.platforms[$p].url // "") | ascii_downcase | startswith("https://") and contains("/" + ($repo | ascii_downcase) + "/")' latest.json > /dev/null \
              || { echo "::error::latest.json platforms.$PLATFORM has no url in $GH_REPO"; exit 1; }
          done
          # The signatures must come from the key whose public half the app trusts; a wrong
          # TAURI_SIGNING_PRIVATE_KEY secret fails here, before anything is published.
          python3 scripts/check_updater_signature.py latest.json frontend/src-tauri/tauri.conf.json darwin-x86_64 darwin-x86_64-app \
            || { echo "::error::latest.json is not signed with the key in tauri.conf.json"; exit 1; }
          echo "latest.json OK for $VERSION (platforms: $(jq -r '.platforms | keys | join(", ")' latest.json))"

      - name: Publish the draft
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        run: |
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true > /dev/null
          echo "Published $TAG."

      - name: Dry run, draft left unpublished
        if: github.event_name != 'push' && github.event.inputs.publish != 'true'
        run: |
          echo "Dry run: the checks passed and the draft for $TAG was NOT published."
          echo "Inspect it under Releases, then delete it (or re-run with publish ticked)."
