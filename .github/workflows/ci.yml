name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  # Pushes to develop get their own group (per SHA) so a pending run is never dropped.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # Pull request pushes supersede each other; runs on develop all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent work runs in parallel; only the app bundle needs the (scarce) Intel Mac runner.
#
#   python    (ubuntu)         full pytest + lint-imports
#   frontend  (ubuntu)         typecheck + contract tests
#   rust      (macos-15 arm)   cargo test
#   bundle    (macos-15-intel) macOS-only pytest -> sidecar -> smoke test -> app bundle -> bundle check
#   windows   (windows)        cargo check --lib
#
# Every Python process that serves HTTP skips a slow reverse DNS lookup: Python's
# HTTPServer.server_bind() calls socket.getfqdn(), which takes ~35 s on the hosted macOS runners.
# pytest (tests/test_http_client.py) and the Rust tests (fake backend served by
# `python3 http.server`) both hit it, so the jobs that run them put a sitecustomize shim on
# PYTHONPATH. The PyInstaller build and the app bundle clear PYTHONPATH so the shim cannot end up
# in the bundled sidecar.
jobs:
  python:
    # The suite is platform-neutral except tests/test_macos_invariants.py, which is gated with
    # `skipif(sys.platform != "darwin")` (24 tests). Those run in the `bundle` job on the Intel Mac,
    # so the combined coverage equals the old single-job run (780 tests).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail instead of silently re-resolving when uv.lock is stale (covers uv sync and uv run).
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Skip slow reverse DNS lookup in Python
        run: |
          mkdir -p "$RUNNER_TEMP/pyfix"
          printf 'import socket\nsocket.getfqdn = lambda name="": name or "localhost"\n' > "$RUNNER_TEMP/pyfix/sitecustomize.py"
          echo "PYTHONPATH=$RUNNER_TEMP/pyfix" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7
        with:
          # Same interpreter family as the local sidecar build (3.12.11), not the runner default.
          python-version: "3.12"
          enable-cache: true

      - name: Python tests
        run: |
          uv sync
          uv run pytest --durations=15
          uv run lint-imports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:contract

  rust:
    # Apple Silicon runner: the tests need neither the Intel architecture nor the real sidecar
    # (they write their own stub executables), so they do not wait for macos-15-intel.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Skip slow reverse DNS lookup in Python
        run: |
          mkdir -p "$RUNNER_TEMP/pyfix"
          printf 'import socket\nsocket.getfqdn = lambda name="": name or "localhost"\n' > "$RUNNER_TEMP/pyfix/sitecustomize.py"
          echo "PYTHONPATH=$RUNNER_TEMP/pyfix" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # tauri-build requires resources/backend-sidecar to exist; the real sidecar is not built
      # here, an empty directory is enough to compile and run the tests.
      - name: Create empty sidecar placeholder
        run: mkdir -p frontend/src-tauri/resources/backend-sidecar

      - name: Rust tests
        working-directory: frontend/src-tauri
        run: cargo test

  bundle:
    # Intel runner: matches the installed app (x86_64). macos-13 is retired. The sidecar, its smoke
    # test and the app bundle stay sequential: the bundle embeds the sidecar.
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      # Fail instead of silently re-resolving when uv.lock is stale (covers uv sync, uv run and
      # the `uv run` inside the sidecar build).
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Skip slow reverse DNS lookup in Python
        run: |
          mkdir -p "$RUNNER_TEMP/pyfix"
          printf 'import socket\nsocket.getfqdn = lambda name="": name or "localhost"\n' > "$RUNNER_TEMP/pyfix/sitecustomize.py"
          echo "PYTHONPATH=$RUNNER_TEMP/pyfix" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7
        with:
          # Same interpreter family as the local sidecar build (3.12.11), not the runner default.
          python-version: "3.12"
          enable-cache: true

      # The only tests that need macOS (skipped everywhere else); the rest run in the `python` job.
      # Running them here, on the Intel dependency set the app ships with, keeps them on the
      # platform they pin at the cost of a few seconds.
      - name: macOS-only Python tests
        run: |
          uv sync
          uv run pytest tests/test_macos_invariants.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # tauri-build requires resources/backend-sidecar to exist, so the sidecar comes first.
      # PYTHONPATH is cleared so the shim cannot end up in the PyInstaller bundle.
      - name: Build backend sidecar
        working-directory: frontend
        env:
          PYTHONPATH: ""
        run: npm run build:backend-sidecar

      # AC6: the BUILT sidecar must import rusaint and load its native library. /api/grades/status
      # reports `available: true` only then; the check starts no u-SAINT sign-in (no network, no
      # credentials, throwaway app-data dir).
      - name: Smoke-test the built sidecar (grades available)
        run: |
          find frontend/src-tauri/resources/backend-sidecar/ssu-api/_internal/rusaint -type f -exec ls -l {} \;
          du -sk frontend/src-tauri/resources/backend-sidecar/ssu-api
          python3 scripts/smoke_backend_sidecar.py

      # tauri.conf.json sets bundle.createUpdaterArtifacts: true, and `tauri build` then fails
      # ("A public key has been found, but no private key") unless TAURI_SIGNING_PRIVATE_KEY is
      # set. PR builds never get that secret, so `npm run tauri:build` (frontend/package.json)
      # builds with src-tauri/no-updater.conf.json, which turns updater artifacts off. Signed
      # updater artifacts are built only by the release workflow (`tauri:build:release`).
      - name: Build macOS app bundle (no dmg, no signing, no upload)
        working-directory: frontend
        env:
          PYTHONPATH: ""
        run: npm run tauri:build -- --bundles app

      - name: Check the sidecar is inside the app bundle
        run: |
          APP=$(find frontend/src-tauri/target -type d -name "SSU Lecture Downloader.app" -path "*/bundle/macos/*" | head -n 1)
          test -n "$APP" || { echo "app bundle not found"; exit 1; }
          echo "bundle: $APP"
          SIDECAR="$APP/Contents/Resources/resources/backend-sidecar/ssu-api"
          test -x "$SIDECAR/ssu-api" || { echo "missing executable $SIDECAR/ssu-api"; exit 1; }
          test -d "$SIDECAR/_internal" || { echo "missing $SIDECAR/_internal"; exit 1; }
          test -f "$SIDECAR/_internal/rusaint/librusaint_ffi.dylib" || { echo "missing rusaint native library in $SIDECAR"; exit 1; }

  # Compile-only guard for the Windows platform stubs (frontend/src-tauri/src/platform/windows.rs).
  # No tests here: the existing Rust tests assume a unix shell. Windows adapters come in S2.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # tauri-build requires resources/backend-sidecar to exist; the real sidecar is not built
      # here, an empty directory is enough to compile.
      - name: Create empty sidecar placeholder
        shell: bash
        run: mkdir -p frontend/src-tauri/resources/backend-sidecar

      - name: Cargo check
        working-directory: frontend/src-tauri
        run: cargo check --lib
