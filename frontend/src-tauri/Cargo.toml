[package]
name = "ssu-lecture-downloader"
version = "0.1.0"
description = "SSU Lecture Downloader"
authors = ["SSU Lecture Downloader"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "ssu_lecture_downloader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The updater and process plugins exist on desktop targets only (mobile has no in-app updater).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2.12", features = ["tray-icon", "test"] }
