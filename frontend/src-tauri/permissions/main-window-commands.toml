# Permissions of the app's own commands (Tauri app manifest, see build.rs).
#
# Declaring an app manifest makes Tauri check every app command against the capabilities, so
# each command the main window calls needs an entry here and in `main-window-commands`. A test in
# `src/acl_tests.rs` keeps this file and `generate_handler!` in `lib.rs` in step.
# The playback signal command is deliberately NOT part of the set: only the remote LMS pages of
# the playback window may call it (capabilities/watch-remote.json).

[[permission]]
identifier = "allow-real-download-dir"
description = "Allows the main window to call `real_download_dir`."
commands.allow = ["real_download_dir"]

[[permission]]
identifier = "allow-deadline-cache-write"
description = "Allows the main window to call `deadline_cache_write`."
commands.allow = ["deadline_cache_write"]

