[[set]]
identifier = "main-window-commands"
description = "Every app command the main window uses."
permissions = [
  "allow-real-download-dir",
  "allow-deadline-cache-write",
  "allow-reminders-status",
  "allow-reminders-set-enabled",
  "allow-reminders-test",
  "allow-open-path-in-finder",
  "allow-open-url-in-browser",
  "allow-open-official-viewer-with-session",
  "allow-open-lms-page-with-session",
  "allow-watch-queue-start",
  "allow-watch-queue-next",
  "allow-watch-queue-stop",
  "allow-watch-queue-status",
