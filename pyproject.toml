[project]
name = "ssu-lecture-downloader"
version = "0.1.0"
description = "Terminal-first Soongsil LMS lecture discovery and downloader groundwork."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "curl-cffi>=0.7",
    "fastapi>=0.136.1",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "imageio-ffmpeg>=0.5.1",
    "pydantic>=2",
    "python-dotenv>=1",
    "rusaint==0.16.3",
    "typer>=0.12",
    "uvicorn[standard]>=0.47.0",
    "websockets>=13",
]

[project.scripts]
ssu-lecture-downloader = "ssu_lecture_downloader.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.importlinter]
root_package = "ssu_lecture_downloader"

[[tool.importlinter.contracts]]
name = "core imports nothing from service or cli"
type = "forbidden"
source_modules = ["ssu_lecture_downloader.core"]
forbidden_modules = [
    "ssu_lecture_downloader.service",
    "ssu_lecture_downloader.cli",
]

[[tool.importlinter.contracts]]
name = "core imports nothing from platforms"
type = "forbidden"
source_modules = ["ssu_lecture_downloader.core"]
forbidden_modules = ["ssu_lecture_downloader.platforms"]

[[tool.importlinter.contracts]]
name = "platforms import nothing from service or cli"
type = "forbidden"
source_modules = ["ssu_lecture_downloader.platforms"]
forbidden_modules = [
    "ssu_lecture_downloader.service",
    "ssu_lecture_downloader.cli",
]

# Module-level guarantee: nothing but service/app_context.py (and cli.py, which is not listed as a
# source) imports the platforms package. Re-exports are covered by tests/test_import_boundaries.py,
# which also fails when any other module imports select_platform/Platform/MacOSPlatform/WindowsPlatform
# by name (for example through app_context).
[[tool.importlinter.contracts]]
name = "only app_context and cli import platforms"
type = "forbidden"
source_modules = [
    "ssu_lecture_downloader.core",
    "ssu_lecture_downloader.service",
    "ssu_lecture_downloader.api",
]
forbidden_modules = ["ssu_lecture_downloader.platforms"]
ignore_imports = [
    "ssu_lecture_downloader.service.app_context -> ssu_lecture_downloader.platforms",
    "ssu_lecture_downloader.service.app_context -> ssu_lecture_downloader.platforms.base",
]
