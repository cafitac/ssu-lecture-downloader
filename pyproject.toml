[project]
name = "ssu-lecture-downloader"
version = "0.1.0"
description = "Terminal-first Soongsil LMS lecture discovery and downloader groundwork."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "curl-cffi>=0.7",
    "fastapi>=0.136.1",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "imageio-ffmpeg>=0.5.1",
    "pydantic>=2",
    "python-dotenv>=1",
    "typer>=0.12",
    "uvicorn[standard]>=0.47.0",
    "websockets>=13",
]

[project.scripts]
ssu-lecture-downloader = "ssu_lecture_downloader.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
